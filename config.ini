; Set HF_TOKEN in your environment for private repositories.
hf_repo = khushalR/id_cards_extractor
; hf_subpath = indian_id_models/YoloX-Medium-ONNX/Iteration-4-3rd_Plus_Aadhaar_VID_plus_VoterID_Addition
hf_subpath = indian_id_models/YoloX-Small-ONNX/Iteration-6-5th_iter_plus_New_VoterID_Samples_Addition
