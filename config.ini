[model]
; Model loading source: "local" or "huggingface"
source = huggingface

; Local model directory (relative to project root or absolute path)
dir = /home/khushal/Downloads/IDX_MODELS/IDX/Indian_IDX/YoloX-Medium-ONNX/Iteration-4-3rd_Plus_Aadhaar_VID_plus_VoterID_Addition
onnx_file = model.onnx
